name: eez-network-landing
services:
  landing:
    image: eez-network-landing:local
    build:
      context: .
      dockerfile: landing/Dockerfile
    ports:
      - "127.0.0.1:${EEZ_LANDING_PORT:-8090}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
