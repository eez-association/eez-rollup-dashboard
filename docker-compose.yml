name: eez-rollup-ui

x-cow-common: &cow-common
  image: eez-cow-light:local
  build:
    context: ./demos/cow-light
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 128
  environment: &cow-environment
    COW_NETWORK: "${COW_NETWORK:-mainnet}"
    COW_DEPLOYMENT_ENV: "${COW_DEPLOYMENT_ENV:-}"
    L2_GENESIS_HASH: "${L2_GENESIS_HASH:-}"
    L1_RPC: "${L1_RPC:-}"
    L2_RPC: "${L2_RPC:-}"
    L2_FRONT: "${L2_FRONT:-}"
    L1_CHAIN_ID: "${L1_CHAIN_ID:-}"
    L2_CHAIN_ID: "${L2_CHAIN_ID:-}"
    L2_ROLLUP_ID: "${L2_ROLLUP_ID:-}"
    BRIDGE_L1: "${BRIDGE_L1:-}"
    BRIDGE_L2: "${BRIDGE_L2:-}"
    EEZ_MANAGER_L2: "${EEZ_MANAGER_L2:-}"
    WETH_L1: "${WETH_L1:-}"
    WETH_L2: "${WETH_L2:-}"
    SETTLEMENT_L2: "${SETTLEMENT_L2:-}"
    NATIVE_WETH_L2: "${NATIVE_WETH_L2:-}"
    COW_FAUCET_L1: "${COW_FAUCET_L1:-}"
    TOKEN_CATALOG: "${TOKEN_CATALOG:-}"
    COW_MANIFEST: "${COW_MANIFEST:-}"
    ROUTE_MANIFEST: "${ROUTE_MANIFEST:-}"
    ORDER_QUEUE: "${ORDER_QUEUE:-}"
    SOLVER_LOG: "${SOLVER_LOG:-}"
    WRAPPER_REFERENCE_TX: "${WRAPPER_REFERENCE_TX:-}"
    WRAPPER_PREFIX_LEN: "${WRAPPER_PREFIX_LEN:-}"
    COW_PUBLIC_L1_RPC: "${COW_PUBLIC_L1_RPC:-}"
    COW_PUBLIC_L2_FRONT: "${COW_PUBLIC_L2_FRONT:-}"
    COW_WRAPPER_EXPLORER_API: "${COW_WRAPPER_EXPLORER_API:-}"
    EEZ_UI_L1_RPC_UPSTREAM: "${EEZ_UI_L1_RPC_UPSTREAM:-}"
    EEZ_UI_L2_RPC_UPSTREAM: "${EEZ_UI_L2_RPC_UPSTREAM:-}"
    EEZ_UI_L2_FRONT_UPSTREAM: "${EEZ_UI_L2_FRONT_UPSTREAM:-}"
    EEZ_UI_L1_EXPLORER_URL: "${EEZ_UI_L1_EXPLORER_URL:-}"
    EEZ_UI_L2_EXPLORER_URL: "${EEZ_UI_L2_EXPLORER_URL:-}"
    EEZ_L1_BRIDGE_SENDER: "${EEZ_L1_BRIDGE_SENDER:-}"
    EEZ_L2_BRIDGE_RECEIVER: "${EEZ_L2_BRIDGE_RECEIVER:-}"
    EEZL2_ADDRESS: "${EEZL2_ADDRESS:-}"
    EEZ_ROLLUP_ID: "${EEZ_ROLLUP_ID:-}"
  volumes:
    - cow-runtime:/app/runtime


services:
  ui:
    image: "${EEZ_UI_IMAGE:-eez-rollup-ui:local}"
    build:
      context: .
      args:
        EEZ_UI_PROTOCOL_COMMIT: "${EEZ_UI_PROTOCOL_COMMIT:-development}"
        EEZ_UI_BASE_PATH: "${EEZ_UI_BASE_PATH:-/dashboard/}"
    ports:
      - "${EEZ_UI_BIND:-127.0.0.1}:${EEZ_UI_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EEZ_UI_NETWORK_NAME: "${EEZ_UI_NETWORK_NAME:-EEZ development network}"
      EEZ_UI_L1_NETWORK_NAME: "${EEZ_UI_L1_NETWORK_NAME:-}"
      EEZ_UI_L1_NETWORK_LOGO_URL: "${EEZ_UI_L1_NETWORK_LOGO_URL:-}"
      EEZ_UI_L1_EXPLORER_API_URL: "${EEZ_UI_L1_EXPLORER_API_URL:-}"
      EEZ_UI_TOKEN_LIST_URL: "${EEZ_UI_TOKEN_LIST_URL:-}"
      EEZ_UI_ENCLAVE: "${EEZ_UI_ENCLAVE:-standalone}"
      EEZ_UI_LISTEN: "8080"
      EEZ_UI_MONITOR_UPSTREAM: "monitor:8080"
      EEZ_UI_TRACE_UPSTREAM: "trace-decoder:8080"
      EEZ_UI_COW_UPSTREAM: "${EEZ_UI_COW_UPSTREAM:-http://cow-api:8787}"
      EEZ_UI_PROTOCOL_COMMIT: "${EEZ_UI_PROTOCOL_COMMIT:-development}"
      EEZ_UI_L1_RPC_UPSTREAM: "${EEZ_UI_L1_RPC_UPSTREAM:-http://host.docker.internal:19545}"
      EEZ_UI_L2_RPC_UPSTREAM: "${EEZ_UI_L2_RPC_UPSTREAM:-http://host.docker.internal:19546}"
      EEZ_UI_L1_FRONT_UPSTREAM: "${EEZ_UI_L1_FRONT_UPSTREAM:-http://host.docker.internal:19547}"
      EEZ_UI_L2_FRONT_UPSTREAM: "${EEZ_UI_L2_FRONT_UPSTREAM:-http://host.docker.internal:19548}"
      EEZ_REGISTRY_ADDRESS: "${EEZ_REGISTRY_ADDRESS:-}"
      EEZL2_ADDRESS: "${EEZL2_ADDRESS:-}"
      EEZ_ECDSA_PROOF_SYSTEM_ADDRESS: "${EEZ_ECDSA_PROOF_SYSTEM_ADDRESS:-}"
      EEZ_ROLLUP_MANAGER_ADDRESS: "${EEZ_ROLLUP_MANAGER_ADDRESS:-}"
      EEZ_L1_BRIDGE_SENDER: "${EEZ_L1_BRIDGE_SENDER:-}"
      EEZ_L2_BRIDGE_RECEIVER: "${EEZ_L2_BRIDGE_RECEIVER:-}"
      EEZ_ROLLUP_ID: "${EEZ_ROLLUP_ID:-1}"
      EEZ_UI_L1_FEES_ENABLED: "${EEZ_UI_L1_FEES_ENABLED:-false}"
      EEZ_UI_L2_FEES_ENABLED: "${EEZ_UI_L2_FEES_ENABLED:-false}"
      EEZ_UI_L1_FEE_MAX_TOTAL_WEI: "${EEZ_UI_L1_FEE_MAX_TOTAL_WEI:-100000000000000000}"
      EEZ_UI_L2_FEE_MAX_TOTAL_WEI: "${EEZ_UI_L2_FEE_MAX_TOTAL_WEI:-100000000000000000}"
      EEZ_UI_DEMO_BRIDGE_ADDRESS: "${EEZ_UI_DEMO_BRIDGE_ADDRESS:-}"
      EEZ_UI_DEMO_TOKEN_ADDRESS: "${EEZ_UI_DEMO_TOKEN_ADDRESS:-}"
      EEZ_UI_DEMO_POOL_ADDRESS: "${EEZ_UI_DEMO_POOL_ADDRESS:-}"
      EEZ_UI_DEMO_EXECUTOR_L1: "${EEZ_UI_DEMO_EXECUTOR_L1:-}"
      EEZ_UI_DEMO_EXECUTOR_L2: "${EEZ_UI_DEMO_EXECUTOR_L2:-}"
      EEZ_UI_DEMO_WRAPPED_TOKEN_L2: "${EEZ_UI_DEMO_WRAPPED_TOKEN_L2:-}"
      EEZ_UI_DEMO_NFT_L2: "${EEZ_UI_DEMO_NFT_L2:-}"
      EEZ_UI_REVERSE_EXECUTOR_L2: "${EEZ_UI_REVERSE_EXECUTOR_L2:-}"
      EEZ_UI_REVERSE_NFT_L1: "${EEZ_UI_REVERSE_NFT_L1:-}"
      EEZ_UI_REVERSE_EXECUTOR_L1: "${EEZ_UI_REVERSE_EXECUTOR_L1:-}"
      EEZ_UI_AGG_WETH_ADDRESS: "${EEZ_UI_AGG_WETH_ADDRESS:-}"
      EEZ_UI_AGG_USDC_ADDRESS: "${EEZ_UI_AGG_USDC_ADDRESS:-}"
      EEZ_UI_AGG_L1_AMM_ADDRESS: "${EEZ_UI_AGG_L1_AMM_ADDRESS:-}"
      EEZ_UI_AGG_AGGREGATOR_ADDRESS: "${EEZ_UI_AGG_AGGREGATOR_ADDRESS:-}"
      EEZ_UI_AGG_L2_EXECUTOR_ADDRESS: "${EEZ_UI_AGG_L2_EXECUTOR_ADDRESS:-}"
      EEZ_UI_AGG_L2_AMM_ADDRESS: "${EEZ_UI_AGG_L2_AMM_ADDRESS:-}"
      EEZ_UI_AGG_L2_EXECUTOR_PROXY_ADDRESS: "${EEZ_UI_AGG_L2_EXECUTOR_PROXY_ADDRESS:-}"
      EEZ_UI_AGG_WRAPPED_WETH_L2: "${EEZ_UI_AGG_WRAPPED_WETH_L2:-}"
      EEZ_UI_AGG_WRAPPED_USDC_L2: "${EEZ_UI_AGG_WRAPPED_USDC_L2:-}"
      EEZ_UI_L1_EXPLORER_URL: "${EEZ_UI_L1_EXPLORER_URL:-}"
      EEZ_UI_L2_EXPLORER_URL: "${EEZ_UI_L2_EXPLORER_URL:-}"
      EEZ_UI_L2_EXPLORER_API_URL: "${EEZ_UI_L2_EXPLORER_API_URL:-}"
    depends_on:
      trace-decoder:
        condition: service_started
      monitor:
        condition: service_healthy
    restart: unless-stopped

  monitor:
    build:
      context: ./src/monitor
    image: eez-network-monitor:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EEZ_L1_RPC_URL: "${EEZ_UI_L1_RPC_UPSTREAM:-http://host.docker.internal:19545}"
      EEZ_L2_RPC_URL: "${EEZ_UI_L2_RPC_UPSTREAM:-http://host.docker.internal:19546}"
      EEZ_L1_WS_URL: "${EEZ_L1_WS_URL:-}"
      EEZ_L2_WS_URL: "${EEZ_L2_WS_URL:-}"
      EEZ_LIVE_UPDATE_SECONDS: "${EEZ_LIVE_UPDATE_SECONDS:-1}"
      EEZ_BEACON_URL: "${EEZ_BEACON_URL:-}"
      EEZ_REGISTRY_ADDRESS: "${EEZ_REGISTRY_ADDRESS:-}"
      EEZ_ROLLUP_ID: "${EEZ_ROLLUP_ID:-1}"
      EEZ_L1_RECENT_BLOCKS: "${EEZ_L1_RECENT_BLOCKS:-20}"
      EEZ_L2_RECENT_BLOCKS: "${EEZ_L2_RECENT_BLOCKS:-100}"
      EEZ_L1_BLOCK_TIME_MS: "${EEZ_L1_BLOCK_TIME_MS:-}"
      EEZ_REFRESH_SECONDS: "${EEZ_REFRESH_SECONDS:-4}"
      EEZ_HEAD_DELAY_WARNING_SECONDS: "${EEZ_HEAD_DELAY_WARNING_SECONDS:-30}"
      EEZ_REQUEST_TIMEOUT_SECONDS: "${EEZ_REQUEST_TIMEOUT_SECONDS:-4}"
      EEZ_L1_EXPLORER_URL: "${EEZ_UI_L1_EXPLORER_URL:-}"
      EEZ_L2_EXPLORER_URL: "${EEZ_UI_L2_EXPLORER_URL:-}"
      EEZ_BLOBSCAN_URL: "${EEZ_BLOBSCAN_URL:-}"
      EEZ_BLOBSCAN_API_URL: "${EEZ_BLOBSCAN_API_URL:-}"
      EEZ_L1_COMPOSER_RPC_URL: "${EEZ_L1_COMPOSER_RPC_URL:-}"
      EEZ_L2_COMPOSER_RPC_URL: "${EEZ_L2_COMPOSER_RPC_URL:-}"
      EEZ_SETTLEMENT_LOOKBACK_BLOCKS: "${EEZ_SETTLEMENT_LOOKBACK_BLOCKS:-512}"
      EEZ_RECENT_SETTLEMENTS: "${EEZ_RECENT_SETTLEMENTS:-12}"
      EEZ_L1_NATIVE_CURRENCY: "${EEZ_L1_NATIVE_CURRENCY:-ETH}"
      EEZ_SETTLEMENT_POLICY_ENABLED: "${EEZ_SETTLEMENT_POLICY_ENABLED:-}"
      EEZ_SETTLEMENT_PURE_L2_MODE: "${EEZ_SETTLEMENT_PURE_L2_MODE:-}"
      EEZ_SETTLEMENT_PURE_L2_INTERVAL_MS: "${EEZ_SETTLEMENT_PURE_L2_INTERVAL_MS:-}"
      EEZ_SETTLEMENT_MAX_UNSETTLED_L2_BLOCKS: "${EEZ_SETTLEMENT_MAX_UNSETTLED_L2_BLOCKS:-}"
      EEZ_SETTLEMENT_BLOB_FULLNESS_BPS: "${EEZ_SETTLEMENT_BLOB_FULLNESS_BPS:-}"
      EEZ_L2_BLOCK_TIME_MS: "${EEZ_L2_BLOCK_TIME_MS:-}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128

  trace-decoder:
    build:
      context: ./trace-decoder
    image: eez-trace-decoder:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      EEZ_TRACE_HOST: "0.0.0.0"
      EEZ_TRACE_PORT: "8080"
      EEZ_TRACE_TIMEOUT_MS: "${EEZ_TRACE_TIMEOUT_MS:-120000}"
      EEZ_TRACE_CONCURRENCY: "${EEZ_TRACE_CONCURRENCY:-2}"
      EEZ_UI_L1_RPC_UPSTREAM: "${EEZ_UI_L1_RPC_UPSTREAM:-http://host.docker.internal:19545}"
      EEZ_UI_L2_RPC_UPSTREAM: "${EEZ_UI_L2_RPC_UPSTREAM:-http://host.docker.internal:19546}"
      EEZ_UI_L1_FRONT_UPSTREAM: "${EEZ_UI_L1_FRONT_UPSTREAM:-http://host.docker.internal:19547}"
      EEZ_UI_L2_FRONT_UPSTREAM: "${EEZ_UI_L2_FRONT_UPSTREAM:-http://host.docker.internal:19548}"
      EEZ_UI_L1_TRACE_RPC_UPSTREAM: "${EEZ_UI_L1_TRACE_RPC_UPSTREAM:-}"
      EEZ_UI_L2_TRACE_RPC_UPSTREAM: "${EEZ_UI_L2_TRACE_RPC_UPSTREAM:-}"
      EEZ_REGISTRY_ADDRESS: "${EEZ_REGISTRY_ADDRESS:-}"
      EEZL2_ADDRESS: "${EEZL2_ADDRESS:-}"
      EEZ_ROLLUP_MANAGER_ADDRESS: "${EEZ_ROLLUP_MANAGER_ADDRESS:-}"
      EEZ_UI_L1_EXPLORER_URL: "${EEZ_UI_L1_EXPLORER_URL:-}"
      EEZ_UI_L2_EXPLORER_URL: "${EEZ_UI_L2_EXPLORER_URL:-}"
      EEZ_UI_L1_EXPLORER_API_URL: "${EEZ_UI_L1_EXPLORER_API_URL:-}"
      EEZ_UI_L2_EXPLORER_API_URL: "${EEZ_UI_L2_EXPLORER_API_URL:-}"
      EEZ_TRACE_L1_EXPLORER_API_KEY: "${EEZ_TRACE_L1_EXPLORER_API_KEY:-}"
      EEZ_TRACE_L2_EXPLORER_API_KEY: "${EEZ_TRACE_L2_EXPLORER_API_KEY:-}"
      EEZ_TRACE_ETHERSCAN_API_KEY: "${EEZ_TRACE_ETHERSCAN_API_KEY:-}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m

  verification:
    build:
      context: .
      target: verification
    image: eez-treasury-verification:local
    environment:
      ETHERSCAN_API_KEY: "${ETHERSCAN_API_KEY:-}"
    network_mode: "service:ui"
    depends_on:
      ui:
        condition: service_healthy
    volumes:
      - treasury-verification:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 512m
    restart: unless-stopped

  cow-api:
    <<: *cow-common
    environment:
      <<: *cow-environment
      HOST: 0.0.0.0
      PORT: "8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cow-solver:
    <<: *cow-common
    profiles: [cow-solver]
    command: ["python", "solver/worker.py"]
    environment:
      <<: *cow-environment
      SOLVER_PRIVATE_KEY: "${SOLVER_PRIVATE_KEY:-}"
      GPV2_ARTIFACT: /app/upstream-artifacts/GPv2Settlement.json
      COW_SOLVER_MAX_FEE_WEI: "${COW_SOLVER_MAX_FEE_WEI:-5000000000000000}"
    volumes:
      - cow-runtime:/app/runtime
      - type: bind
        source: ${COW_ROUTE_ARTIFACTS_DIR:-./demos/cow-light/contracts/out}
        target: /app/contracts/out
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COW_UPSTREAM_ARTIFACTS_DIR:-./demos/cow-light/contracts/artifacts}
        target: /app/upstream-artifacts
        read_only: true
        bind:
          create_host_path: false
volumes:
  cow-runtime:
  treasury-verification:
