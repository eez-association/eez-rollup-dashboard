name: Treasury checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: treasury-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            trace-decoder/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install dashboard and decoder dependencies
        run: |
          npm ci
          npm ci --prefix trace-decoder --ignore-scripts
      - name: Dependency security advisories
        run: |
          npm audit --audit-level=high
          npm audit --prefix trace-decoder --audit-level=high
      - name: Verify pinned source release
        run: npm run check:treasury-release
      - name: Unit and contract checks
        run: |
          npm test
          npm test --prefix trace-decoder
          node src/monitor/tests/test_app.mjs
          node src/monitor/tests/test_live_app.mjs
          npm run test:contracts
          forge fmt --check --root contracts
          npm run build:treasury-release
      - name: Isolated deployment and source verification
        run: |
          node tests/integration/treasury-source-verification.mjs
          node tests/integration/treasury-paired-setup.mjs
          node tests/integration/treasury-paired-setup.mjs --current-bridge
      - name: CoW solver and contract regressions
        run: |
          python3 -m venv /tmp/cow-ci-venv
          /tmp/cow-ci-venv/bin/pip install -r demos/cow-light/requirements.txt
          npm ci --prefix demos/cow-light/contracts --ignore-scripts
          forge test --root demos/cow-light/contracts -vv
          cd demos/cow-light
          /tmp/cow-ci-venv/bin/python -m unittest discover -s tests -v
          node --test tests/ui-network.test.cjs
      - name: Browser regressions
        env:
          CHROME_DEVEL_SANDBOX: /usr/local/sbin/eez-chromium-sandbox
        run: |
          npx playwright install --with-deps chromium
          # Use the helper from the pinned browser, not the runner's Chrome image.
          sandbox_source="$(node -e 'const { chromium } = require("playwright"); const path = require("node:path"); process.stdout.write(path.join(path.dirname(chromium.executablePath()), "chrome_sandbox"));')"
          test -x "$sandbox_source"
          sudo install -o root -g root -m 4755 "$sandbox_source" "$CHROME_DEVEL_SANDBOX"
          test -u "$CHROME_DEVEL_SANDBOX"
          node tests/composer-wallet.cjs
          node tests/treasury-setup-completion-browser.mjs
          node tests/treasury-mainnet-setup-browser.mjs
          node tests/treasury-setup-ux-browser.mjs
          node tests/treasury-gas-bridge-browser.mjs
          node tests/treasury-rollupx-browser.mjs
          node tests/treasury-paired-asset-browser.mjs
          node tests/treasury-payment-history-browser.mjs
          node tests/treasury-history-loading-browser.mjs
          node tests/treasury-payment-signing-browser.mjs
          node tests/treasury-transfer-review-browser.mjs
          node tests/treasury-reload-browser.mjs
          node tests/integration/treasury-paired-setup.mjs --browser
          node tests/treasury-verification-browser.mjs
          node tests/trace-details.cjs
      - name: CoW dashboard regressions
        env:
          CHROME_DEVEL_SANDBOX: /usr/local/sbin/eez-chromium-sandbox
          EEZ_UI_URL: http://127.0.0.1:8083/dashboard
        run: |
          npm run build
          mkdir -p .runtime
          npm run preview -- --host 127.0.0.1 --port 8083 --strictPort > .runtime/cow-ci-preview.log 2>&1 &
          cow_preview_pid=$!
          trap 'kill "$cow_preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$EEZ_UI_URL/" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$EEZ_UI_URL/" > /dev/null
          node tests/cow-demo.cjs
          node tests/cow-trading.cjs
          node tests/cow-faucet.cjs
          node tests/cow-history.cjs
          node tests/cow-token-status.cjs
          node tests/cow-fees.cjs
      - name: Frontend, service images, and service coexistence
        run: |
          npm run build
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.host-rpc.yml config --quiet
          docker build --target verification -t treasury-verification:check .
          docker build -t treasury-ui:check .
          docker build -t eez-trace-decoder:check trace-decoder
          node tests/trace-services.mjs
          git diff --exit-code
      - name: Preserve isolated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-checks
          path: .runtime/
          include-hidden-files: true
          retention-days: 7
