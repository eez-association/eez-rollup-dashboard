name: Treasury checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: treasury-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            trace-decoder/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install dashboard and decoder dependencies
        run: |
          npm ci
          npm ci --prefix trace-decoder --ignore-scripts
      - name: Dependency security advisories
        run: |
          npm audit --audit-level=high
          npm audit --prefix trace-decoder --audit-level=high
      - name: Verify pinned source release
        run: npm run check:treasury-release
      - name: Unit and contract checks
        run: |
          npm test
          npm test --prefix trace-decoder
          npm run test:contracts
          forge fmt --check --root contracts
          npm run build:treasury-release
      - name: Isolated deployment and source verification
        run: |
          node tests/integration/treasury-source-verification.mjs
          node tests/integration/treasury-deployment-batches.mjs
      - name: Browser regressions
        env:
          CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
        run: |
          test -u "$CHROME_DEVEL_SANDBOX"
          npx playwright install --with-deps chromium
          node tests/treasury-setup-completion-browser.mjs
          node tests/treasury-mainnet-setup-browser.mjs
          node tests/treasury-faucet-browser.mjs
          node tests/treasury-verification-browser.mjs
          node tests/trace-details.cjs
      - name: Frontend, service images, and service coexistence
        run: |
          npm run build
          docker compose --env-file /dev/null config --quiet
          docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.host-rpc.yml config --quiet
          docker build --target verification -t treasury-verification:check .
          docker build -t treasury-ui:check .
          docker build -t eez-trace-decoder:check trace-decoder
          node tests/trace-services.mjs
          git diff --exit-code
      - name: Preserve isolated test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-checks
          path: .runtime/
          include-hidden-files: true
          retention-days: 7
